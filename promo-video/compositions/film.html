  <script>
    (function () {
      const tl0 = gsap.timeline({ paused: true });
      // The film was first timed without the opener; T() maps those times onto the final 30 s
      // (opener 0-4 s, then each beat shifted, the hand-check and end card shortened).
      const BP = [[0, 4.0], [2.85, 6.6], [7.5, 10.6], [12.45, 15.55], [12.75, 15.7], [15.4, 18.1], [21.2, 23.1], [21.45, 23.25], [22.4, 23.55], [25.2, 26.1], [26.9, 27.35], [27.95, 27.85], [30, 30]];
      const T = (t) => { for (let i = 0; i < BP.length - 1; i++) { const [a, x] = BP[i], [b, y] = BP[i + 1]; if (t >= a && t <= b) return x + (t - a) * (y - x) / (b - a); } return t; };
      const tl = { fromTo: (e, f, g, t) => tl0.fromTo(e, f, g, T(t)), set: (e, v, t) => tl0.set(e, v, T(t)) };
      const R = { immediateRender: false };
      const q = (s) => document.querySelectorAll("#root " + s);

      // Blur swaps: a field value or an instruction line is rewritten in place
      const out = (el, t, d = 0.18) => tl.fromTo(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power2.in", ...R }, t);
      const inn = (el, t, d = 0.2) => tl.fromTo(el, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power3.out", ...R }, t);
      const swap = (a, b, t) => { out(a, t); inn(b, t + 0.14); };
      // A bubble is filled in like a pencil mark, left to right
      const fill = (el, t, d = 0.35) => tl.fromTo(el, { clipPath: "inset(-10px 140% -10px -10px)" }, { clipPath: "inset(-10px -10px -10px -10px)", duration: d, ease: "expo.out", ...R }, t);
      const ink = (el, t) => tl.fromTo(el, { color: "#5f6b82" }, { color: "#12161d", duration: 0.25, ease: "power2.out", ...R }, t);
      const slotX = (i) => (i < 4 ? i * 120 : 536 + (i - 4) * 120);
      const moveCur = (i, t, d = 0.4) => tl.fromTo("#cur", { x: slotX(i - 1) }, { x: slotX(i), duration: d, ease: "power2.inOut", ...R }, t);

      // Opener (final times): the problem; the reading head runs back and forth over the rounds
      tl0.fromTo("#op2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out", immediateRender: false }, 0.3);
      [[0, 8, 0.5, 0.55], [8, 2, 1.15, 0.5], [2, 6, 1.75, 0.4], [6, 1, 2.25, 0.4], [1, 7, 2.75, 0.35], [7, 0, 3.2, 0.45]].forEach(([a, b, t, d]) =>
        tl0.fromTo("#cur", { x: slotX(a) }, { x: slotX(b), duration: d, ease: "power2.inOut", immediateRender: false }, t));
      tl0.fromTo(["#op1", "#op2"], { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 3.8);
      tl0.fromTo(["#qbox", "#wording", "#hv-p76", "#rv1"], { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out", immediateRender: false }, 3.95);

      // the question inks in, like an entry being written
      tl.fromTo(q("#wording .w"), { color: "#8d98ab" }, { color: "#12161d", duration: 0.16, stagger: 0.07, ease: "power2.out" }, 0.05);
      tl.set("#rl1", { color: "#12161d" }, 0.0);
      inn("#in1", 1.3, 0.22);

      // 3.0 – 7.6  the rounds tick by; the month changes, cosmetically
      moveCur(1, 2.85); swap("#rv1", "#rv2", 2.85); swap("#mo1", "#mo2", 2.9);
      ink("#rl2", 3.0); fill("#mk2", 3.1); inn("#tag2", 3.3, 0.2);
      moveCur(2, 4.45); swap("#rv2", "#rv3", 4.45); swap("#mo2", "#mo3", 4.5);
      ink("#rl3", 4.6); fill("#mk3", 4.7);
      swap("#in1", "#in2", 5.6);

      // 7.6 – 12.4  December 2020: the programme's name changes
      moveCur(3, 7.5); swap("#rv3", "#rv4", 7.5); swap("#mo3", "#mo4", 7.55); ink("#rl4", 7.65);
      tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power2.inOut", ...R }, 8.4);
      tl.fromTo(q("#old .w"), { color: "#12161d" }, { color: "#c8102e", duration: 0.3, ...R }, 8.5);
      tl.fromTo("#new", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power2.out", ...R }, 8.85);
      tl.fromTo("#mk4", { clipPath: "inset(-10px -10px -10px -10px)", scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)", ...R }, 9.3);
      inn("#gloss", 9.45, 0.22);
      swap("#in2", "#in3", 9.8);

      // 12.4 – 15.4  deriva is written into the Tool field
      tl.fromTo("#tool-word", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power2.out", ...R }, 12.45);
      swap("#in3", "#in4", 12.75);

      // 15.4 – 21.2  the row of rounds becomes the subject
      out(["#qbox", "#wording", "#gloss", "#in4"], 15.4, 0.22);
      tl.fromTo("#row", { y: 0 }, { y: -250, duration: 0.7, ease: "power2.inOut", ...R }, 15.5);
      inn("#proof-title", 15.95, 0.22);
      tl.fromTo("#brk", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.4, ease: "power2.out", ...R }, 16.35);
      [5, 6, 7, 8, 9].forEach((n, k) => {
        const t = 16.6 + k * 0.32;
        moveCur(n - 1, t - 0.12, 0.28);
        ink("#rl" + n, t);
      });
      fill("#mk8", 17.3);
      tl.fromTo("#cur", { opacity: 1 }, { opacity: 0, duration: 0.3, ...R }, 18.2);
      inn("#brk-note", 18.2, 0.22);
      ["#lg1", "#lg2", "#lg3", "#lg4"].forEach((s, k) => inn(s, 18.5 + k * 0.18, 0.2));

      // 21.2 – 25.2  the rule against hand labels
      out(["#row", "#proof-title", "#brk-note", "#legend", "#head"], 21.2, 0.22);
      inn("#trust", 21.45, 0.25);
      tl.fromTo(q(".gc"), { opacity: 1 }, { opacity: 0.22, duration: 0.3, ease: "power2.out", ...R }, 22.4);
      tl.fromTo("#g3", { scale: 1 }, { scale: 1.12, duration: 0.45, ease: "expo.out", ...R }, 22.45);
      inn("#t-zero", 22.55, 0.22);

      // 25.2 – 30.0  claim and end card
      out("#trust", 25.2, 0.22);
      tl.fromTo(q("#claim1 .cw"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.08, ease: "power3.out", ...R }, 25.45);
      tl.fromTo(q("#claim2 .cw"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.1, ease: "power3.out", ...R }, 26.3);
      tl.fromTo("#endrule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut", ...R }, 26.9);
      tl.fromTo("#endmark", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power2.out", ...R }, 27.3);
